spring:
  application:
    name: demand-response-service
  datasource:
    url: jdbc:postgresql://localhost:5432/demand_response
    username: demand_response
    password: demand_response
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# gRPC Server Configuration
grpc:
  server:
    port: 9090

# AWS Configuration (LocalStack)
aws:
  endpoint: http://localhost:4566
  region: us-east-1
  access-key-id: test
  secret-access-key: test

# SNS Topic Configuration
sns:
  topic:
    name: demand-response-events

# Logging
logging:
  level:
    com.example.demandresponse: INFO
    org.hibernate.SQL: DEBUG
